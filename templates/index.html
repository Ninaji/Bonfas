<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bonfas — Ficha de Equipamento</title>
  <link rel="stylesheet" href="/static/equipment.css">
  <style>
    body {
      margin: 0;
      background: #efe6d2;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .page-hdr {
      background: #2b2b2b;
      color: #fff;
      padding: 14px 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .page-hdr h1 { margin: 0; font-size: 18px; letter-spacing: 2px; }
    .page-hdr select {
      padding: 4px 8px; font: inherit;
      background: #fff; border: 1px solid #555; border-radius: 2px;
    }
    .stack { padding: 18px 0 40px; }
    .raca-card {
      max-width: 960px; margin: 14px auto 0; padding: 12px 16px;
      background: #fff; border: 1.5px solid #333;
    }
    .raca-card h2 { margin: 0 0 4px; color: #8b2e26; font-size: 16px; }
    .raca-card .tagline { font-style: italic; color: #555; margin-bottom: 6px; }
    .raca-card p { margin: 4px 0; font-size: 13px; }
  </style>
</head>
<body>

  <header class="page-hdr">
    <h1>BONFAS — FICHA</h1>
    <label>Personagem:
      <select id="char-select">
        <option value="char-001">char-001</option>
        <option value="char-002">char-002</option>
        <option value="char-003">char-003</option>
      </select>
    </label>
    <label>Raça:
      <select id="raca-select"><option value="">(carregando…)</option></select>
    </label>
  </header>

  <main class="stack">

    <div id="raca-info" class="raca-card" style="display:none"></div>

    <div id="equip"></div>

  </main>

  <script src="/static/equipment.js"></script>
  <script>
    // ---------- Ficha de equipamento ----------
    let widget = EquipmentSheet.mount('#equip', {
      characterId: 'char-001',
      silhouette:  '/static/Aventureiro.png',
      apiBase:     '/api',
      storage:     'local',    // troque para 'server' para persistir no SQLite
    });

    document.getElementById('char-select').addEventListener('change', (e) => {
      widget = EquipmentSheet.mount('#equip', {
        characterId: e.target.value,
        silhouette:  '/static/Aventureiro.png',
        apiBase:     '/api',
        storage:     'local',
      });
    });

    // ---------- Consumo da API de raças (para mostrar que integra) ----------
    const racaSel  = document.getElementById('raca-select');
    const racaInfo = document.getElementById('raca-info');

    fetch('/api/racas').then(r => r.json()).then(list => {
      racaSel.innerHTML = '<option value="">— escolha —</option>' +
        list.map(r => `<option value="${r.Slug}">${r.Nome}</option>`).join('');
    }).catch(() => { racaSel.innerHTML = '<option>(API offline)</option>'; });

    racaSel.addEventListener('change', async (e) => {
      const slug = e.target.value;
      if (!slug) { racaInfo.style.display = 'none'; return; }
      const r = await fetch('/api/racas/' + slug).then(x => x.json());
      racaInfo.style.display = 'block';
      racaInfo.innerHTML = `
        <h2>${r.Nome}</h2>
        <div class="tagline">${r.Tagline || ''}</div>
        <p><b>Apresentação:</b> ${r.LorePresentation || ''}</p>
        <p><b>Roleplay:</b> ${r.LoreRoleplay || ''}</p>
        <p><b>Sociedade:</b> ${r.LoreSociety || ''}</p>
        <p><b>Linhagens:</b> ${(r.linhagens||[]).map(l=>l.Nome).join(', ') || '—'}</p>
        <p><b>Traços:</b> ${(r.tracos||[]).map(t=>t.Nome).join(', ') || '—'}</p>
      `;
    });
  </script>
</body>
</html>
